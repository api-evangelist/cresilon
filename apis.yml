aid: cresilon
name: Cresilon
description: >-
  Cresilon is a Brooklyn, New York biotechnology company founded in 2010 by Joe Landolina and
  Isaac Miller that develops, manufactures and markets hemostatic medical devices built on a
  proprietary plant-based hydrogel that stops moderate to severe bleeding in seconds without
  manual pressure. The company operates a GMP-certified, ISO 13485:2016 quality-managed
  biomanufacturing facility in Brooklyn's Industry City and sells two commercial products:
  VETIGEL, launched to the veterinary market in 2020 and licensed for animal-health distribution,
  and TRAUMAGEL, cleared by the FDA under 510(k) in 2024 and launched nationwide in the United
  States in January 2025 for prehospital, military and hospital control of traumatic external
  hemorrhage. Cresilon was named the number one medical-device company on Fast Company's World's
  Most Innovative Companies list in 2024 and returned to that list in 2026. Cresilon is a
  medical-device manufacturer rather than a software vendor, and publishes no commercial or
  developer-facing product API. The only machine-readable interface it exposes is the WordPress
  REST content API behind its corporate website at cresilon.com, captured here for discovery
  purposes.
