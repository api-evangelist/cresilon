- target: $.info
  update:
    x-apievangelist-consumption-guidance: 'Authentication: none required for any documented operation
      — send no Authorization header. Pagination: page/per_page with X-WP-Total, X-WP-TotalPages and an
      RFC 8288 Link header; per_page is capped at 100 and 999 returns HTTP 400 rest_invalid_param. Caching:
      NO Cache-Control, ETag or Last-Modified is returned, so conditional requests are unavailable and
      there is no stated freshness window — poll conservatively. Rate limits: none signalled anywhere,
      and robots.txt sets no crawl delay; self-throttle. Errors: the WordPress {code, message, data.status}
      envelope, NOT RFC 9457, and capability failures come back as 401 rather than 403. Trim responses
      with _fields (a single untrimmed page object measured 51 KB, dominated by yoast_head) and inline
      relations with _embed.'
- target: $.info
  update:
    x-apievangelist-surface-note: The `author` field is a single shared account on every post, so it carries
      no editorial signal. Tagging is effectively unused — 4 tags across 34 untagged posts.
