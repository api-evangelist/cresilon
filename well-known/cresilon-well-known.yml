notes: >-
  cresilon.com publishes no /.well-known/ discovery documents at all, and no A2A agent card at
  either the canonical or the legacy path. Note the false-positive hazard on this host: the
  WordPress 404 handler returns a full HTML page (~277 KB) for unknown /.well-known/* paths, so a
  naive probe that only checks for a non-empty body would mis-read every one of these as a hit.
  Each 404 above is the observed HTTP status, and every 404 body was text/html, not JSON. The
  only discovery surface that exists is the WordPress route index at /wp-json/, which is why the
  contract-discovery pass treated it as the provider's machine-readable contract.
