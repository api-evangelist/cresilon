stability:
  assessment: unmanaged
  detail: >-
    This is an incidental API surface. It is public and stable in shape because WordPress core is,
    but Cresilon makes no commitment about it, monitors no consumers, and would have no mechanism
    to warn them of a breaking change. There is no caching contract either (no Cache-Control, no
    ETag), so consumers cannot revalidate cheaply. Pin to nothing, poll conservatively, and
    tolerate the surface disappearing entirely.
