  Cresilon operates no API program, so it publishes no API versioning policy, no deprecation
  policy, no SLA, no status page and no API changelog. What versioning exists is inherited from
  the WordPress platform and its plugins. Absence is recorded here as observed fact — no
  StatusPage and no Deprecation pointer is wired for this provider because neither page exists.
