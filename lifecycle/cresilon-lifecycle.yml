  owner: platform
  detail: >-
    The version segment is set by WordPress core and by each plugin, not by Cresilon. This site
    carries an unusually large plugin surface — 45 registered namespaces including jetpack/v4,
    wpdm and wpdmpp/v1 (WordPress Download Manager, behind the member area), elementor/v1,
    astra/v1, yoast/v1, redirection/v1, akismet/v1, monsterinsights/v1 and code-snippets/v1 — and
    a WordPress core or plugin upgrade can alter this surface without any notice to callers. That
    is the principal consumption risk here.
